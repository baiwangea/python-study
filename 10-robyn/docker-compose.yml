version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=robyn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - robyn-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - robyn-network

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/robyn_db
      - DATABASE_URL_ASYNC=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/robyn_db
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - APPLY_MIGRATIONS=true
      - LOG_LEVEL=INFO
      - SQLALCHEMY_LOG_LEVEL=WARNING
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates
    networks:
      - robyn-network
    command: python app/main.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  robyn-network:
    driver: bridge

volumes:
  postgres_data:
